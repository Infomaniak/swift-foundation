name: CI workflow

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode-Latest.app/Contents/Developer

jobs:
  build_and_test_iOS:
    name: Build and Test project on iOS
    runs-on: [ self-hosted, iOS ]
    env:
      SIMULATOR_NAME: ${{ vars.LATEST_IPHONE_SIMULATOR || 'iPhone 18 Pro' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        run: xcodebuild -scheme InfomaniakFoundation-Package build -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=latest"
      - name: Test
        run: xcodebuild -scheme InfomaniakFoundation-Package test -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=latest" -enableCodeCoverage YES -resultBundlePath ResultBundle.xcresult
      - name: Convert Coverage Report
        run: ./Scripts/xccov-to-generic.sh ResultBundle.xcresult > coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 #6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_and_test_macOS:
    name: Build and Test project on macOS
    runs-on: [ self-hosted, iOS ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        run: swift build
      - name: Test
        run: swift test
